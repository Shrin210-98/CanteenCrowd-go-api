version: "2"
sql:
  - engine: "postgresql"
    schema: "./internal/database/sql/schemas/*.sql"  
    queries: "./internal/database/sql/queries/*.sql"
    gen:
      go:
        package: "database"
        out: "internal/database"
        sql_package: "pgx/v5"
        emit_json_tags: true
        json_tags_case_style: "camel"
        emit_prepared_queries: true    # For performance
        # emit_methods_with_db_argument: true  
        emit_interface: true
        emit_exact_table_names: false
        emit_sql_as_comment: false
        emit_empty_slices: true
        overrides:
          # Non-nullable UUID
          - db_type: "uuid" 
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          # Nullable UUID becomes pointer
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          # Non-nullable text
          - db_type: "text"
            go_type: "string"
          # Nullable text becomes pointer
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true

          # Non-nullable timestamp
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          # Nullable timestamp becomes pointer
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          # Non-nullable date
          - db_type: "date"
            go_type:
              import: "time"
              type: "Time"
          # Nullable date becomes pointer
          - db_type: "date"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          # Non-nullable JSONB
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          # Nullable JSONB becomes pointer
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
          # Non-nullable boolean
          - db_type: "bool"
            go_type: "bool"
          # Nullable boolean becomes pointer
          - db_type: "bool"
            nullable: true
            go_type:
              type: "bool"
              pointer: true
          # Non-nullable integer
          - db_type: "int4"
            go_type: "int32"
          # Nullable integer becomes pointer
          - db_type: "int4"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          # Non-nullable bigint
          - db_type: "int8"
            go_type: "int64"
          # Nullable bigint becomes pointer
          - db_type: "int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true

          # Numeric/Decimal types 
          - db_type: "numeric"
            go_type: "float64"
          - db_type: "numeric"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
          # Decimal alias 
          - db_type: "decimal"
            go_type: "float64"
          - db_type: "decimal"
            nullable: true
            go_type:
              type: "float64"
              pointer: true
