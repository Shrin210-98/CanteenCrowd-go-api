services:
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - api-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro # For SSL certificates (optional)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://api:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  psql_bp:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - psql_volume_bp:/var/lib/postgresql/data
    networks:
      - api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      DB_HOST: psql_bp
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "8080"
    depends_on:
      psql_bp:
        condition: service_healthy
    networks:
      - api-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - psql_bp
    networks:
      - api-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Development tools
  sqlc:
    image: sqlc/sqlc:1.27.0
    volumes:
      - .:/src
    working_dir: /src
    command: generate
    profiles:
      - tools

  # Optional: Add database migrations tool
  golang-migrate:
    image: migrate/migrate:v4.17.0
    volumes:
      - ./migrations:/migrations
    networks:
      - api-network 
    profiles:
      - tools

networks:
  api-network:
    driver: bridge

volumes:
  psql_volume_bp:
  pgadmin_data:
